name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  # Called by publish.yml (Actions > Release > Run workflow) with the tag it
  # just pushed: a tag pushed from a workflow does not trigger this one.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v1.3.0.4)'
        type: string
        required: true

env:
  # The ref being built: the called tag, else the triggering ref
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE }}
  CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}

jobs:
  Create-Release:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RELEASE_REF }}
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        
    - name: Setup signtool
      uses: microsoft/setup-msbuild@v3
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Decode Certificate
      if: ${{ env.CERTIFICATE_BASE64 != '' }}
      run: |
        $certBytes = [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64)
        $certPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath "signing-cert.pfx"
        [IO.File]::WriteAllBytes($certPath, $certBytes)
        echo "CERTIFICATE_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      shell: pwsh
      
    - name: Sign Executable
      if: ${{ env.CERTIFICATE_BASE64 != '' }}
      run: |
        # Find signtool.exe dynamically
        $signtoolPath = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -Recurse -ErrorAction SilentlyContinue |
                        Sort-Object FullName -Descending |
                        Select-Object -First 1

        if (-not $signtoolPath) {
          Write-Error "signtool.exe not found in Windows SDK"
          exit 1
        }

        Write-Host "Using signtool: $($signtoolPath.FullName)"

        # Executables, plus the PowerShell scripts shipped at the package root
        # (LiteTask-Post-Build.ps1 runs during self-update before any file is
        # replaced, so UpdateManager requires it to carry the publisher signature).
        $files = @(Get-ChildItem -Path "bin\Release\*.exe" -Recurse) + @(Get-ChildItem -Path "bin\Release\*.ps1")
        foreach ($file in $files) {
          Write-Host "Signing: $($file.FullName)"
          & $signtoolPath.FullName sign /f "$env:CERTIFICATE_PATH" /p "$env:CERTIFICATE_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 "$($file.FullName)"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to sign $($file.FullName)"
            exit 1
          }
        }
      shell: pwsh

    - name: Create Release Zip
      if: startsWith(env.RELEASE_REF, 'refs/tags/')
      run: |
        Compress-Archive -Path "bin\Release\*" -DestinationPath "bin\LiteTask.zip" -Force
        Write-Host "Created LiteTask.zip"
      shell: pwsh

    - name: Upload Artifacts
      id: artifact-upload-step
      uses: actions/upload-artifact@v7
      with:
        name: LiteTask
        path: bin/Release/
        retention-days: 5

    - name: Create Release
      if: startsWith(env.RELEASE_REF, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.tag || github.ref_name }}
        files: bin/LiteTask.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}